<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#FFDF73" />
            <stop offset="50%" stop-color="#D4AF37" />
            <stop offset="100%" stop-color="#8B7322" />
        </linearGradient>
        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="5" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
    </defs>
    <!-- Background shield shape -->
    <path d="M100 180 L20 60 L100 20 L180 60 Z" fill="#111" stroke="url(#goldGradient)" stroke-width="4"/>
    
    <!-- GG Letters -->
    <path d="M80 80 L50 80 L50 140 L90 140 L90 110 L70 110" fill="none" stroke="url(#goldGradient)" stroke-width="15" stroke-linejoin="miter" stroke-miterlimit="4"/>
    <path d="M150 80 L120 80 L120 140 L160 140 L160 110 L140 110" fill="none" stroke="url(#goldGradient)" stroke-width="15" stroke-linejoin="miter" stroke-miterlimit="4"/>
    
    <!-- Stylized Muscle/Shoulder outline above -->
    <path d="M40 50 C 60 20, 140 20, 160 50" fill="none" stroke="url(#goldGradient)" stroke-width="6" stroke-linecap="round"/>
</svg>
